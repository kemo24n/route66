services:
  - type: web
    name: route66
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: route66-db, property: connectionString }
      - key: AUTH_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: TZ_OFFSET_MINUTES
        value: "180"
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
databases:
  - name: route66-db
    plan: basic-256mb
